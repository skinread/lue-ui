packages:
  - packages/*
  - apps/*
  - fixtures/*

# Supply-chain guard: don't install versions published in the last day.
minimumReleaseAge: 1440

# Dependency build scripts are refused unless listed here (strictDepBuilds is on by default).
allowBuilds:
  # Its install script only re-checks the platform binary, which the optional @esbuild/* package already provides.
  esbuild: false
