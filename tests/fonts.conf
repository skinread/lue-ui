<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Test-only font rendering (vitest.config.ts sets FONTCONFIG_FILE on Linux): the system's fonts, rendered the same way
     on every machine, so visual baselines match between a dev container and CI. Greyscale anti-aliasing, no hinting:
     Ubuntu's default would otherwise give subpixel (RGB) text on one machine and greyscale on another. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
  </match>
</fontconfig>
