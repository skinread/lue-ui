# Publishes Storybook to GitHub Pages: every component's stories, plus llms.txt, a Markdown page per component, the
# tokens and the contracts it serves (tools/build-ai-docs.mjs). Run by hand from the Actions tab for now; later a step
# of the release workflow (HANDOVER.md, Pass 5). Nothing from the Claude Design canvas or Design System is in the build.
name: Storybook to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer run waits rather than cancelling one that's publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Tokens first: the docs build reads them for tokens.md and the MCP data.
      - run: pnpm build
      # Writes apps/docs/public (llms.txt and the pages), then storybook build into apps/docs/storybook-static.
      - run: pnpm --filter @lue-ui/docs build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/storybook-static

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
